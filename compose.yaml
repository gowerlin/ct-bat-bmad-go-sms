# sms-platform dev container (course units 4-09 / 4-10).
#
# Defaults fit the public repo: sms-platform IS the repo root, cloned as
# ct-bat-bmad-go-sms. Another layout sets the SMS_* variables below, in the
# shell or in .env next to this file (compose reads it; .env is not in git):
#   SMS_REPO_ROOT  host folder to mount = the repo root (default .)
#   SMS_REPO_NAME  its folder name; container path is /workspace/<name>
#                  (default ct-bat-bmad-go-sms)
#   SMS_SUBDIR     sms-platform's path inside the repo, with a leading /
#                  (default empty: sms-platform is the repo root)
#   SMS_CT_SKILLS  folder holding control-tower/ and ct-*/ to bake into the
#                  image (default: none; see Dockerfile)
#   SMS_IMAGE      image tag (default sms-platform-dev:latest)
# `scripts/dev-container.sh env` prints these for the repo it sits in, e.g.
# sms-platform inside a bigger repo (the course production repo):
#   scripts/dev-container.sh env >> .env
#
# Run every docker command from the WSL distro that owns the daemon:
#   wsl -e bash -lc 'cd /mnt/<drive>/.../sms-platform && docker compose up -d dev'
#   docker port bat-server-sms-platform        # 9876/tcp -> 127.0.0.1:9880
#   docker exec bat-server-sms-platform sh -lc 'go test ./... -race'   # working_dir is sms-platform/
# Then in BAT: Profiles → + More → Add Docker Profile → "Use existing" and pick
# the folder SMS_REPO_ROOT points at, so the stored mount matches
# /workspace/<SMS_REPO_NAME>.
name: sms-platform

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      # Optional BuildKit named context; replaces the empty `ct-skills` stage
      # of the Dockerfile. scripts/ct-skills-none/ holds no skills.
      additional_contexts:
        ct-skills: ${SMS_CT_SKILLS:-./scripts/ct-skills-none}
      args:
        BAT_IMAGE: bat-server:latest
        GO_VERSION: "1.27.3"
        SMS_WORKDIR: /workspace/${SMS_REPO_NAME:-ct-bat-bmad-go-sms}${SMS_SUBDIR:-}
    image: ${SMS_IMAGE:-sms-platform-dev:latest}
    container_name: bat-server-sms-platform
    restart: unless-stopped
    ports:
      # loopback only: the server hands out a root shell (docker-deployment.md
      # § Port exposure). 9880 avoids BAT's own remote server port 9876.
      - "127.0.0.1:9880:9876"
    volumes:
      # The ONE host folder the BAT wizard will be told about; container path
      # is fixed to /workspace/<folder name>. The repo root is mounted (not
      # just sms-platform/ when it sits deeper) so .git is inside the mount
      # and work orders can be committed from within the container.
      - ${SMS_REPO_ROOT:-.}:/workspace/${SMS_REPO_NAME:-ct-bat-bmad-go-sms}
      # Token + certificate survive `docker rm` on the named volume.
      - bat-server-sms-platform-data:/root/.local/share/bat-server
    # Shells and `docker exec` start in the Go module, not at the repo root.
    working_dir: /workspace/${SMS_REPO_NAME:-ct-bat-bmad-go-sms}${SMS_SUBDIR:-}
    # smsd has no default provider: without this, `make run` inside the
    # container fails at startup. mock never touches the network.
    environment:
      PROVIDER: mock
    # entrypoint / command / healthcheck come from bat-server:latest — do not
    # override them, or BAT's "Use existing" cannot read the token.

volumes:
  bat-server-sms-platform-data:
