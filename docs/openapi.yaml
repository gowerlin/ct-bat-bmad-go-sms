# sms-platform API — OpenAPI shell (COURSE-PLAN § 5.4).
# T0193 (P1-c) lists the routes only; request/response schemas are TODO and
# are filled by the work order that implements each route. CH5 finalises it.
openapi: 3.1.0
info:
  title: sms-platform API
  version: 0.0.1-skeleton
  description: |
    SMS 通訊平台（課程示範專案）。錯誤格式一律
    `{"error":{"code":"…","message":"…"}}`；401 無 API key、404 跨租戶、
    422 模板缺變數、429 限流（含 `Retry-After`）。
    租戶以 header `X-API-Key` 認證。
servers:
  - url: http://127.0.0.1:8080
    description: local smsd (`make run`)

paths:
  /healthz:
    get:
      summary: 健康檢查（CH1，T0001）
      operationId: healthz
      security: []
      responses:
        "200":
          description: 服務存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required: [status]

  /v1/messages:
    post:
      summary: 送出訊息（CH2；202＋id；可帶 template_id＋vars）
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "202":
          description: 已排入佇列，回 id 與 status=queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendMessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/QueueFull" }
    get:
      summary: 列表與篩選（CH4，T0006；`?status=`；本租戶的訊息，依 (created_at, id) 新到舊）
      operationId: listMessages
      parameters:
        - name: status
          in: query
          required: false
          description: 省略時回本租戶全部狀態；不在列舉內（含空字串、大小寫不同）回 400 invalid_request，訊息不回顯輸入
          schema:
            type: string
            enum: [queued, sending, sent, delivered, undelivered, failed]
        - name: limit
          in: query
          required: false
          description: 每頁筆數；不在 1–100 的整數回 400 invalid_request
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: 上一頁回應的 next_cursor，原樣帶回；不是伺服器產生的值回 400 invalid_request
          schema:
            type: string
      responses:
        "200":
          description: 本租戶符合條件的訊息（一頁）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/messages/{id}:
    get:
      summary: 查單筆狀態（CH2）
      operationId: getMessage
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 訊息目前狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/templates:
    post:
      summary: 建立模板（CH4，T0004）
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateRequest" }
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/InvalidTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: 列出模板（CH4，T0004；本租戶的模板，新到舊，不分頁）
      operationId: listTemplates
      responses:
        "200":
          description: 本租戶的模板
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/templates/{id}:
    get:
      summary: 讀取模板（CH4，T0004）
      operationId: getTemplate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 模板
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: 刪除模板（CH4，T0004）
      operationId: deleteTemplate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已刪除
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/providers/{name}/callbacks:
    post:
      summary: 供應商狀態回呼（CH5，T0009）
      operationId: providerCallback
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [mock, mitake]
      description: >-
        供應商回報送達結果。不經 API key、不計限流；驗證由該供應商的 ParseCallback 負責
        （共用密鑰、constant-time）。以 provider_ref 找到 sent 的訊息並轉為 delivered／undelivered，
        同一個原子操作寫入租戶通知 outbox，(message_id, status) 唯一，所以重複回呼不會重複通知租戶（D015）。
      requestBody:
        required: true
        description: >-
          格式由各供應商的 ParseCallback 定義。mock：表單或 query `ref=<provider_ref>&status=delivered|undelivered`
          （status 省略視為 delivered，無驗證，只供本機示範）。mitake（模擬，非真實規格）：
          `application/x-www-form-urlencoded` 的 `msgid`、`statuscode`、選填 `donetime`，
          並以 header `X-Mitake-Secret` 帶 PROVIDER_CALLBACK_SECRET（D017）。
        content:
          application/x-www-form-urlencoded:
            schema: { type: object }
      responses:
        "204":
          description: 本次回呼造成狀態轉移（sent → delivered／undelivered），租戶通知已入列
        "200":
          description: 訊息已是終態（重複回呼或終態後的回呼），狀態不變、不再通知；body 為空
        "400":
          description: invalid_request：供應商無法解析的回呼，或狀態不是 delivered／undelivered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: unauthorized：回呼驗證失敗（ParseCallback 回 ErrUnauthorized），狀態不變
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: not_found：未知供應商、查無 provider_ref，或訊息尚未寫入 sent（由供應商重送）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

# 出站（非本 API 的路徑）：狀態經供應商回呼轉為 delivered／undelivered 時，平台 POST 到
# 租戶的 callback_url（租戶沒有 callback_url 則不通知），每個 (message_id, status) 最多一次：
#   Content-Type: application/json
#   X-Signature: sha256=<小寫 hex>   # HMAC-SHA256(租戶 callback secret, 原始 body bytes)，不含時間戳（D013）
#   body: {"id":"msg_…","status":"delivered"}   # 固定兩個欄位，見 components.schemas.WebhookNotification
# 租戶回 2xx 即完成；否則退避 1s、2s、4s 重試，共 4 次，用盡只記日誌、不改訊息狀態。
# 同一訊息的通知依產生順序送出。驗證範例見 docs/onboarding.md。

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        invalid_request：欄位缺漏、號碼非 E.164、內容（直接或模板渲染後）超過 70 code point、
        body 與 template_id 同時給或都沒給、vars 不是字串值的物件、JSON 無效；405 方法不符亦用 invalid_request 並帶 Allow
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidTemplate:
      description: >-
        invalid_template：模板無法解析（佔位符括號不成對、名稱空白或不合法）；
        name、body 缺漏或 JSON 無效為 invalid_request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QueueFull:
      description: 佇列滿載（queue_full），不建立訊息
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 無或錯誤的 API key
    NotFound:
      description: 不存在或屬於其他租戶
    UnprocessableEntity:
      description: 模板缺變數等驗證錯誤
    TooManyRequests:
      description: 超過租戶速率限制
      headers:
        Retry-After:
          schema:
            type: integer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 見 docs/error-codes.md }
            message: { type: string }
    WebhookNotification:
      type: object
      description: >-
        平台送到租戶 callback_url 的通知 body（出站，非本 API 的路徑）。header
        `X-Signature: sha256=<小寫 hex>` 為 HMAC-SHA256(租戶 callback secret, 原始 body bytes)。
      required: [id, status]
      properties:
        id: { type: string, description: 訊息 id（msg_ 開頭） }
        status: { type: string, enum: [delivered, undelivered] }
    SendMessageRequest:
      type: object
      description: body 與 template_id 恰給一個；同時給或都沒給回 400 invalid_request
      required: [to]
      properties:
        to: { type: string, pattern: '^\+[1-9]\d{1,14}$' }
        body: { type: string, description: 最多 70 個 Unicode code point }
        template_id:
          type: string
          description: 本租戶的模板 id（tpl_ 開頭）；入佇列前渲染，結果同樣受 70 code point 限制；不存在或屬他租戶回 404
        vars:
          type: object
          description: 填 {{name}} 佔位符的值，只收字串（null、數字等回 400）；多餘變數忽略，缺變數回 422
          additionalProperties: { type: string }
    SendMessageResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, description: "msg_ 加 128 位元 hex" }
        status: { type: string, const: queued }
    Message:
      type: object
      required: [id, to, status, attempts, created_at, updated_at]
      properties:
        id: { type: string }
        to: { type: string }
        status: { type: string, enum: [queued, sending, sent, delivered, undelivered, failed] }
        attempts:
          type: integer
          description: 已呼叫供應商 Send 的次數（成功那次也算），與 sent／failed 轉移同時寫入，之前為 0；最多 4 次（首次＋重試 3 次，退避 1s、2s、4s）
        failure_reason:
          type: string
          description: 只在 failed／undelivered 出現：「重試用盡」、「永久失敗」、「供應商回報未送達」或「回呼逾時」；不含收件號碼與簡訊內容
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TemplateRequest:
      type: object
      required: [name, body]
      properties:
        name: { type: string }
        body:
          type: string
          description: "含 {{name}} 佔位符；name 為字母或底線開頭，其後字母、數字、底線；括號內前後空白忽略"
    Template:
      type: object
      required: [id, name, body, created_at]
      properties:
        id: { type: string, description: "tpl_ 加 128 位元 hex" }
        name: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
    TemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/Template" }
    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_cursor:
          type: string
          description: 不透明字串（AD-14），帶入下一次請求的 cursor；最後一頁省略
    # TODO（後續 Story 補）: DeliveryReport, OutboundNotification。

security:
  - ApiKey: []
