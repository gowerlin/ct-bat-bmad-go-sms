# sms-platform API — OpenAPI shell (COURSE-PLAN § 5.4).
# T0193 (P1-c) lists the routes only; request/response schemas are TODO and
# are filled by the work order that implements each route. CH5 finalises it.
openapi: 3.1.0
info:
  title: sms-platform API
  version: 0.0.1-skeleton
  description: |
    SMS 通訊平台（課程示範專案）。錯誤格式一律
    `{"error":{"code":"…","message":"…"}}`；401 無 API key、404 跨租戶、
    422 模板缺變數、429 限流（含 `Retry-After`）。
    租戶以 header `X-API-Key` 認證。
servers:
  - url: http://127.0.0.1:8080
    description: local smsd (`make run`)

paths:
  /healthz:
    get:
      summary: 健康檢查（CH1，T0001）
      operationId: healthz
      security: []
      responses:
        "200":
          description: 服務存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required: [status]

  /v1/messages:
    post:
      summary: 送出訊息（CH2；202＋id；可帶 template_id＋vars）
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "202":
          description: 已排入佇列，回 id 與 status=queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendMessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/QueueFull" }
    get:
      summary: 列表與篩選（CH4，T0006；`?status=`）
      operationId: listMessages
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, sending, sent, delivered, undelivered, failed]
      responses:
        "200":
          description: "TODO: MessageList"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/messages/{id}:
    get:
      summary: 查單筆狀態（CH2）
      operationId: getMessage
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 訊息目前狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/templates:
    post:
      summary: 建立模板（CH4，T0004）
      operationId: createTemplate
      requestBody:
        description: "TODO: TemplateRequest（name、body with {{var}}）"
        required: true
      responses:
        "201":
          description: "TODO: Template"
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: 列出模板（CH4，T0004）
      operationId: listTemplates
      responses:
        "200":
          description: "TODO: TemplateList"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/templates/{id}:
    get:
      summary: 讀取模板（CH4，T0004）
      operationId: getTemplate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "TODO: Template"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: 刪除模板（CH4，T0004）
      operationId: deleteTemplate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已刪除
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/providers/{name}/callbacks:
    post:
      summary: 供應商狀態回呼（CH5，T0009）
      operationId: providerCallback
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [mock, mitake]
      requestBody:
        description: "TODO: 供應商各自的回呼格式，由 Provider.ParseCallback 解析"
      responses:
        "204":
          description: 已接收
        "404":
          description: 未知供應商或 provider_ref

# 出站（非本 API 的路徑）：平台以 HMAC 簽章 POST 到租戶的 callback_url，
# 每則訊息最多通知一次（OutboundNotification，CH5 T0009）。TODO: 文件化 payload 與簽章 header。

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: 欄位缺漏、號碼非 E.164、內容超過 70 code point、JSON 無效；405 方法不符亦用 invalid_request 並帶 Allow
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QueueFull:
      description: 佇列滿載（queue_full），不建立訊息
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 無或錯誤的 API key
    NotFound:
      description: 不存在或屬於其他租戶
    UnprocessableEntity:
      description: 模板缺變數等驗證錯誤
    TooManyRequests:
      description: 超過租戶速率限制
      headers:
        Retry-After:
          schema:
            type: integer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 見 docs/error-codes.md }
            message: { type: string }
    SendMessageRequest:
      type: object
      required: [to, body]
      properties:
        to: { type: string, pattern: '^\+[1-9]\d{1,14}$' }
        body: { type: string, description: 最多 70 個 Unicode code point }
    SendMessageResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, description: "msg_ 加 128 位元 hex" }
        status: { type: string, const: queued }
    Message:
      type: object
      required: [id, to, status, attempts, created_at, updated_at]
      properties:
        id: { type: string }
        to: { type: string }
        status: { type: string, enum: [queued, sending, sent, delivered, undelivered, failed] }
        attempts: { type: integer }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    # TODO（後續 Story 補）: MessageList, TemplateRequest, Template,
    # TemplateList, DeliveryReport, OutboundNotification。

security:
  - ApiKey: []
